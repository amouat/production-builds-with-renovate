name: Validate Renovate Config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      -
        # No Chainguard image is available for Renovate, so this uses upstream.
        name: Validate renovate.json
        uses: docker://docker.io/renovate/renovate:latest@sha256:d0358088501c7665688673c8932474b02517941703a16e970e8b4fcf235299cb
        with:
          args: renovate-config-validator
