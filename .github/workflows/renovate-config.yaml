name: Validate Renovate Config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      -
        # No Chainguard image is available for Renovate, so this uses upstream.
        name: Validate renovate.json
        uses: docker://docker.io/renovate/renovate:latest@sha256:62b884d6b537e3bf2e76be3d7b621d582c10ddcee5dda74b0c2ea17901db5129
        with:
          args: renovate-config-validator
