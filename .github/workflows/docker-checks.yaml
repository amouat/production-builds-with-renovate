name: Docker Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # versioned.Dockerfile is excluded as it pulls from a private registry
        dockerfile:
          - Dockerfile
          - cross.Dockerfile
          - cross-xx.Dockerfile

    steps:
      -
        name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      -
        name: Build (no push)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=image.tar
      -
        name: Scan image with Grype
        uses: docker://cgr.dev/chainguard/grype:latest@sha256:de6b916b27e933f12a6fa20ebb76ddda23a469d179c2ece546558cd229971ab3
        env:
          GRYPE_DB_CACHE_DIR: /tmp/grype-db
        with:
          args: docker-archive:image.tar --fail-on high

  hadolint:
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      -
        # No Chainguard image is available for hadolint, so this uses upstream.
        name: Lint Dockerfiles
        uses: docker://docker.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        with:
          entrypoint: /bin/hadolint
          args: Dockerfile cross.Dockerfile cross-xx.Dockerfile versioned.Dockerfile
