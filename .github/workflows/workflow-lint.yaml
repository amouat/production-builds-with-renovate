name: Workflow Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      -
        # No Chainguard image is available for actionlint, so this uses upstream.
        name: Run actionlint
        uses: docker://docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -no-color
      -
        # No Chainguard image is available for zizmor, so this uses upstream.
        name: Run zizmor
        # Run even if actionlint fails, so both sets of findings are reported
        if: ${{ !cancelled() }}
        uses: docker://ghcr.io/zizmorcore/zizmor:latest@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        with:
          args: --offline --format github .
