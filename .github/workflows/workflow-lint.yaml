name: Workflow Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      -
        # No Chainguard image is available for actionlint, so this uses upstream.
        name: Run actionlint
        uses: docker://docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -no-color
      -
        # No Chainguard image is available for zizmor, so this uses upstream.
        name: Run zizmor
        # Run even if actionlint fails, so both sets of findings are reported
        if: ${{ !cancelled() }}
        uses: docker://ghcr.io/zizmorcore/zizmor:latest@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
        with:
          args: --offline --format github .
